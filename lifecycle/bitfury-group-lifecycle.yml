deprecation:
  policy_url: https://exonum.com/doc/version/latest/advanced/versioning/
  sunset_header: false
  policy: 'Exonum publishes versioning guidance rather than a dated deprecation calendar. The documented
    rules: the semantics of a method with a given ID must never change and a method ID must never be
    reused; removing a method or disabling processing for certain payloads is a breaking change; a
    removed method must report the CommonError::MethodRemoved (kind common, code 4) execution error so
    clients get an explicit signal instead of an arbitrary interpretation. The docs recommend that
    deprecated HTTP endpoints emit a deprecation warning via the Deprecation header draft
    (draft-dalal-deprecation-header-02) or the standard Warning header, but the framework does not send
    either automatically.'
  runtime_signal: CommonError::MethodRemoved
  recommended_headers: [Deprecation, Warning]
