  - 'exonum-api: the maximum accepted JSON payload size is now configurable in node.toml via
    api.json_payload_size.'
  - 'exonum-node: the proposer module was extended to also remove transactions from the unconfirmed pool
    and renamed to pool.'
  - 'exonum: transaction correctness verification results can now be cached; backtraces are included in
    ExecutionError.'
  - 'exonum-cli: domain names may now be used alongside IP addresses when generating configs and in the
    connect list.'
- version: 1.0.0
  date: '2020-03-31'
  breaking: true
  highlights:
  - 'Breaking: ApiManagerConfig in exonum-api was made non-exhaustive.'
  - 'exonum-node: nodes terminate gracefully on SIGINT/SIGTERM/SIGQUIT (Unix) or ctrl+c (Windows), with
    NodeBuilder::disable_signals() to opt out.'
  - 'Bug fix: exonum-cli run-dev no longer errors when configuration files already exist in the
    blockchain path.'
- version: 1.0.0-rc.3
  date: '2020-03-25'
  breaking: true
  highlights:
  - 'Breaking: exonum-supervisor POST endpoints now expect JSON-encoded input rather than hex-encoded
    Protobuf - a direct change to the HTTP contract.'
  - 'Breaking: exonum-cli run-dev reworked - it no longer clears database files and artifacts-dir was
    renamed to blockchain-path.'
  - 'exonum-node: nodes can customize how block proposals are created and can skip block generation at a
    consensus epoch.'
  - 'exonum-rust-runtime: ServiceApiScope::pb_endpoint_mut accepts Protobuf-encoded messages on
    endpoints.'
