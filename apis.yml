aid: bitfury-group
name: BitFury
description: 'Bitfury Group is a blockchain technology company founded in 2011 as one of the earliest
  Bitcoin mining hardware makers and full-cycle infrastructure providers, and now operating as a
  technology incubator headquartered in London with data-center and hardware operations behind Bitcoin
  transaction processing. Its developer-facing surface is Exonum, the open-source (Apache-2.0) framework
  Bitfury Group Limited built for private and permissioned blockchain applications: an Exonum node
  exposes REST and WebSocket endpoints through its explorer service, system API plugin, supervisor and
  time-oracle services, and ships light clients for JavaScript, Python and Java plus a Rust crate family,
  a node CLI and published Protobuf message definitions. Bitfury also anchors permissioned chains into
  the Bitcoin blockchain and incubates Cipher Mining, Crystal, LiquidStack and Axelera AI.'
