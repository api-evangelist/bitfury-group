x-enrichment-notes:
  no_openapi: 'Bitfury publishes no OpenAPI, Swagger, GraphQL or AsyncAPI description for Exonum. Probed
    /openapi.json, /swagger.json, /api-docs and /llms.txt on both bitfury.com and exonum.com (all 404 on
    2026-07-31); the published reference is hand-written crate documentation on docs.rs. No spec was
    authored on the provider''s behalf.'
  no_agent_card: /.well-known/agent-card.json and /.well-known/agent.json return 404 on both hosts; no
    A2A card exists and none was written.
  no_mcp: No official or community MCP server for Exonum or Bitfury was found, and there is no OpenAPI to
    derive a candidate tool list from, so mcp/ was skipped.
  no_skills: 'skills/ was skipped by the pipeline rule that agent skills must be grounded in real
    operationIds from an OpenAPI: none exists.'
  no_idempotency: 'Exonum documents the opposite of an idempotency contract - transactions carry a seed
    field expressly to guarantee non-idempotence - so no Idempotency pointer is emitted.'
  no_security_program: probe-security-programs.py found no security.txt, no disclosure page and no trust
    center on 2026-07-31, so no Security, VulnerabilityDisclosure, TrustCenter or Compliance pointer is
    emitted.
  no_well_known: 'Every /.well-known/ path probed returned 404 on both hosts; well-known/ holds the probe
    record only and carries no WellKnown pointer.'
