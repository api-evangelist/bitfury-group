format: exonum-execution-error
format_note: 'Not RFC 9457. Exonum returns execution failures as an `ExecutionError` message defined in
  Protobuf and surfaced as JSON: `{kind, code, description, runtime_id | no_runtime_id, call_site |
  no_call_site}`. The `code` namespace is scoped by `kind`, so code 3 means different things for a core
  error, a common error, a runtime error and a service error. The `description` is advisory only and is
  excluded from the error serialization when a proof of error authenticity is verified.'
envelope:
  message: exonum.runtime.ExecutionError
  fields:
  - {name: kind, type: ErrorKind, description: type of the error, used to disambiguate the origin}
  - {name: code, type: uint32, description: error code, meaning depends on kind}
  - {name: description, type: string, description: optional human-readable description, not part of the
      authenticated serialization}
  - {name: runtime_id, type: uint32, description: set when the error is attributable to a runtime}
  - {name: call_site, type: CallSite, description: set when the error is attributable to a service call
      (call_type, instance_id, method_id, interface)}
  success_wrapper: exonum.runtime.ExecutionStatus (oneof ok | error)
kinds:
- {value: 0, name: UNEXPECTED, description: An unexpected error which does not have a specific cause;
    the description is the only source of information.}
- {value: 1, name: CORE, description: An error specific to the core.}
- {value: 2, name: RUNTIME, description: An error specific to a certain runtime.}
- {value: 3, name: SERVICE, description: An error specific to a certain service.}
- {value: 4, name: COMMON, description: A common error which can occur in different contexts.}
problems:
- {kind: core, code: 0, title: IncorrectRuntime, detail: Runtime identifier is incorrect in this context.}
- {kind: core, code: 1, title: UnknownArtifactId, detail: Artifact identifier is unknown.}
- {kind: core, code: 2, title: ArtifactAlreadyDeployed, detail: Artifact with the given identifier is
    already deployed.}
- {kind: core, code: 3, title: ArtifactNotDeployed, detail: Artifact with the given identifier is not
