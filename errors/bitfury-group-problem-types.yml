- {kind: core, code: 4, title: ServiceNameExists, detail: Specified service name is already used.}
- {kind: core, code: 5, title: ServiceIdExists, detail: Specified service identifier is already used.}
- {kind: core, code: 6, title: ServiceNotActive, detail: Specified service is not active.}
- {kind: core, code: 7, title: IncorrectInstanceId, detail: Suitable runtime for the given service
